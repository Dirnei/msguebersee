# Lokal: docker compose up --build  →  Website http://localhost:4321, Relay http://localhost:8089
services:
  relay:
    build: ./relay
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: http://localhost:4321
      NODE_OPTIONS: --max-http-header-size=65536
    ports:
      - "8089:8080"

  site:
    build:
      context: ./site
      args:
        PUBLIC_RELAY_URL: http://localhost:8089
        # aus der Datei .env (nicht im Git), z. B. WHATSAPP_NUMMER=+49 151 12345678
        WHATSAPP_NUMMER: ${WHATSAPP_NUMMER:-}
    depends_on:
      - relay
    ports:
      - "4321:80"
